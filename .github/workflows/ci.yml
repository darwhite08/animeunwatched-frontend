# Kaiveron frontend — PR gate
#
# Runs typecheck + lint + production build (no deploy) on every PR to
# production and every push to production. Blocks merge if any step fails —
# configure branch protection in GitHub settings → branches → production →
# "Require status checks to pass".

name: CI

on:
  pull_request:
    branches: [production, main]
  push:
    branches: [production, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # Build needs these or the SSR pass throws. Real values come from
      # Vercel env vars in real deploys; CI just needs anything resolvable.
      NEXT_PUBLIC_API_BASE:           https://api.kaiveron.com
      NEXT_PUBLIC_SOCKET_URL:         https://api.kaiveron.com
      API_BASE:                       https://api.kaiveron.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:   ""
      # Skip Sentry source-map upload in CI — there's no real release here
      SENTRY_AUTH_TOKEN:              ""
      NEXT_PUBLIC_SENTRY_DSN:         ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=999
        continue-on-error: true  # warnings don't block; only typecheck + build do

      - name: Build
        run: npm run build
