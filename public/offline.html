<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <title>Offline — Kaiveron</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #020202;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 1.5rem;
    }
    svg { width: 56px; height: 56px; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    p { color: #9ca3af; max-width: 28ch; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.6rem 1.5rem;
      background: #f59e0b;
      color: #020202;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #d97706; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="kGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="22" fill="#0A0F1E" />
    <path d="M 30 28 L 40 28 L 40 46 L 47 46 L 54 28 L 64 28 L 53 50 L 50 50 L 60 72 L 50 72 L 44 60 L 40 60 L 40 72 L 30 72 Z"
      fill="url(#kGold)" />
  </svg>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Kaiveron will be here when you're back.</p>
  <a href="/">Try again</a>
</body>
</html>
