name: Frontend CI/CD — Vercel

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  VERCEL_ORG_ID: team_JOgvGvnWWS2SIqLvz0cQpT2u
  VERCEL_PROJECT_ID: prj_NKeGh9NRmIUj9sOlAfkKFBfCVj4m

jobs:
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install -g vercel@latest
      # Build + deploy on Vercel's own infrastructure (NOT the GitHub runner).
      # Building locally with `vercel build` timed out the ISR-exported
      # /genres/[slug] + /studios/[slug] pages (>60s data fetch from the API)
      # because the runner's path to the API is slow. A remote `vercel deploy`
      # uses Vercel's build environment, which reaches the API fast — same path
      # as a manual `vercel deploy --prod`.
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Live at: $URL"
